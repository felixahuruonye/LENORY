<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LENORY - Voice-First AI Learning Platform</title>
    <meta name="description" content="Experience the future of education with LENORY's voice-first AI learning platform. Real-time transcription, AI tutoring, and intelligent course creation for students and educators." />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LENORY" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="LENORY" />
    <meta name="msapplication-TileColor" content="#8b5cf6" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
      if (typeof __vite_ssr_import_meta__ !== 'undefined') {
        __vite_ssr_import_meta__.hot = {
          accept: () => {},
          dispose: () => {},
          decline: () => {},
          prune: () => {},
          invalidate: () => {},
          on: () => {}
        };
      }
      window.__VITE_HMR_DISABLED__ = true;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);

              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Previously this force-reloaded the page IMMEDIATELY
                      // and unconditionally the moment a new deploy was
                      // noticed — with zero regard for whether the person
                      // was mid-typing a message, mid-send, or in the
                      // middle of anything else. Given how often this app
                      // gets redeployed, that reload could land at any
                      // moment and silently destroy in-progress work —
                      // exactly "typed a long message, hit send, the whole
                      // page reloaded instead of answering." Now: just
                      // remember the waiting worker and tell the app an
                      // update is available; nothing reloads until the
                      // person explicitly chooses to (see
                      // UpdateAvailableBanner in App.tsx).
                      console.log('New SW available — waiting for user to confirm before reloading');
                      window.__lenoryWaitingWorker = newWorker;
                      window.dispatchEvent(new CustomEvent('lenory:sw-update-available'));
                    }
                  });
                }
              });

              registration.update();
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });

        // Only reload on controllerchange if the person actually confirmed
        // the update (see applyLenoryUpdate in App.tsx, which sets this
        // flag right before telling the waiting worker to activate) — a
        // controllerchange this app didn't ask for should never yank the
        // page out from under someone.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (window.__lenoryUpdateConfirmed) {
            console.log('SW controller changed after user-confirmed update, reloading...');
            window.location.reload();
          } else {
            console.log('SW controller changed without user confirmation — not reloading');
          }
        });
      }
    </script>
  </body>
</html>
